services:
  # PostgreSQL — required by LiteLLM's budget/spend tracking (newer litellm
  # builds reject sqlite DATABASE_URL outright; budget caps + alert webhooks
  # (issue #40) need a real database anyway).
  postgres:
    image: postgres:16-alpine
    container_name: newnew-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - newnew-net

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: newnew-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NINEARM_API_KEY=${NINEARM_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - litellm_data:/app/data
      - ./callbacks/nevnew_persona.py:/app/nevnew_persona.py:ro
      - ./callbacks/nevnew_persona_prompt.py:/app/nevnew_persona_prompt.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - newnew-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: newnew-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - newnew-net

  n8n:
    image: n8nio/n8n:latest
    container_name: newnew-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.local
      - WEBHOOK_URL=http://localhost:5678/
      - VUE_APP_SERVER_PORT=5678
      # O2O copilot middleware (n8n/workflows/o2o-copilot-middleware.json) calls
      # LiteLLM on the shared network; the key is passed through for the
      # HTTP Request node's Authorization header.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    networks:
      - newnew-net

  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: newnew-mcpo
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MCPO_API_KEY=${MCPO_API_KEY}
    command:
      [
        "--port", "8000",
        "--api-key", "${MCPO_API_KEY}",
        "--server-type", "streamable-http",
        "--",
        "http://host.docker.internal:5678/mcp/b7e2d1a4-9c3f-4e8a-a6d2-5f1b0c7e9d21",
      ]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - newnew-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: newnew-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_NAME=นิวนิว
      - ENABLE_SIGNUP=true
      - ENABLE_OLLAMA_API=false
    volumes:
      - newnew_open_webui_data:/app/backend/data
      - ./open-webui/custom.css:/app/build/static/custom.css:ro
      - ./open-webui/decor-bg.svg:/app/build/static/decor-bg.svg:ro
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - newnew-net

  telegram-bot:
    build: ./telegram-bot
    container_name: newnew-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID}
      # Cline primary backend: the 9arm gateway key (same provider/model as
      # the Cline session). Passed to the cline CLI via -k at runtime.
      - NINEARM_API_KEY=${NINEARM_API_KEY}
      # Sonnet fallback backend (separate account/quota).
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
    volumes:
      - ./callbacks/nevnew_persona_prompt.py:/app/nevnew_persona_prompt.py:ro
    networks:
      - newnew-net

  # Long-term memory (mem0 + Qdrant, per-user collections). See
  # memory/compose-snippet.yml. Do NOT add `env_file: .env` here — mem0's
  # OpenAI LLM provider auto-routes to OpenRouter when OPENROUTER_API_KEY is
  # present, bypassing the LiteLLM proxy (and its budget cap).
  memory:
    build: ./memory
    container_name: newnew-memory
    restart: unless-stopped
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MEM0_GROQ_MODEL=qwen/qwen3.8-27b
      # GROQ_API_KEY comes from .env so the memory image sees it (the
      # service deliberately does NOT use env_file: mem0's OpenAI-LLM
      # auto-route would leak extraction to OpenRouter otherwise).
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MEMORY_API_KEY=${MEMORY_API_KEY}
      - MEM0_TELEMETRY=false
    volumes:
      # SQLite history (mem0) + the downloaded embedding model cache.
      - nevnew_memory_data:/data
    ports:
      # Ops/debug access from the host; in-network callers use
      # http://memory:8000 (no port publish needed).
      - "8011:8000"
    depends_on:
      - qdrant
      - litellm
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - newnew-net

  # AI Core chat harness: persona + memories + tools -> model -> reply.
  # The single API surface for channels (telegram-bot, n8n). See
  # ai-core/compose-snippet.yml.
  ai-core:
    build: ./ai-core
    container_name: newnew-ai-core
    restart: unless-stopped
    environment:
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - NEVNEW_MODEL_NAME=NevNew
      - MEMORY_BASE_URL=http://memory:8000
      - MEMORY_API_KEY=${MEMORY_API_KEY}
      - MCPO_BASE_URL=http://mcpo:8000
      - MCPO_API_KEY=${MCPO_API_KEY}
      - AICORE_API_KEY=${AICORE_API_KEY}
    volumes:
      - ./callbacks/nevnew_persona_prompt.py:/app/nevnew_persona_prompt.py:ro
    ports:
      # Host access for curl/debugging; in-network callers use
      # http://ai-core:8000.
      - "8010:8000"
    depends_on:
      litellm:
        condition: service_healthy
      memory:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - newnew-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: newnew-cloudflared
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    networks:
      - newnew-net

  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: newnew-cloudflared-quick
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://newnew-open-webui:8080
    networks:
      - newnew-net

networks:
  newnew-net:
    driver: bridge

volumes:
  newnew_open_webui_data:
    name: newnew_open_webui_data
  litellm_data:
    name: litellm_data
  postgres_data:
    name: postgres_data
  qdrant_storage:
    name: qdrant_storage
  n8n_data:
    name: n8n_data
  nevnew_memory_data:
    name: nevnew_memory_data
