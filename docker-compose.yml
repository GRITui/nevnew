services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: newnew-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Flattened next to config.yaml so LiteLLM's custom-callback import
      # ("nevnew_persona.nevnew_persona_instance") resolves without a package path.
      - ./callbacks/nevnew_persona.py:/app/nevnew_persona.py:ro
      - ./callbacks/nevnew_persona_prompt.py:/app/nevnew_persona_prompt.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      # The litellm image has neither wget nor curl, so use Python (always present).
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - newnew-net

  mcpo:
    # MCP-to-OpenAPI bridge (see BACKLOG.md / issue #1): Open-WebUI's
    # External Tool Servers only speaks OpenAPI, but n8n's MCP Server
    # Trigger only speaks raw MCP (JSON-RPC over SSE/streamable-http) —
    # confirmed empirically, no native MCP client in Open-WebUI v0.11.3.
    # mcpo sits in between and translates.
    image: ghcr.io/open-webui/mcpo:main
    container_name: newnew-mcpo
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MCPO_API_KEY=${MCPO_API_KEY}
    # n8n runs natively on the host (not in this compose stack), so it's
    # reached via Docker Desktop's host.docker.internal, not "localhost"
    # (which inside this container would mean itself).
    #
    # URL below points at the "NevNew MCP Spike (issue #6)" n8n workflow's
    # production MCP endpoint — swap in real tool workflows' URLs once they
    # exist; this is proof-of-concept wiring, not a real tool yet.
    command:
      [
        "--port", "8000",
        "--api-key", "${MCPO_API_KEY}",
        "--server-type", "streamable-http",
        "--",
        "http://host.docker.internal:5678/mcp/4f0aba37-3ca9-4fdb-9c6f-251026937d3a",
      ]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - newnew-net

  open-webui:
    # Pinned (was :main) — custom.css below depends on this version's
    # internal class names, so a floating tag could silently break the theme
    # on a future `docker compose pull`.
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: newnew-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Docker-network hostname resolution: reach LiteLLM by service name, not localhost.
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_NAME=นิวนิว
      - ENABLE_SIGNUP=true
      - ENABLE_OLLAMA_API=false
    volumes:
      - newnew_open_webui_data:/app/backend/data
      # Officially-referenced override hook (index.html always links
      # /static/custom.css) — used here for the pink/light theme reskin and
      # hiding the model-selector dropdown, since neither has a supported
      # env var or admin-panel toggle.
      - ./open-webui/custom.css:/app/build/static/custom.css:ro
      - ./open-webui/decor-bg.svg:/app/build/static/decor-bg.svg:ro
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - newnew-net

  telegram-bot:
    # NevNew's MVP mobile/push channel (issue #11): polls Telegram, forwards
    # to LiteLLM (model=NevNew), replies. Persona comes from LiteLLM's own
    # callback — this service doesn't duplicate it. Owner-only whitelist and
    # per-user history live in telegram-bot/bot.py.
    build: ./telegram-bot
    container_name: newnew-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - CLINE_CONFIG_DIR=/cline-home
    volumes:
      # Reuses the persona system prompt for the cline fallback path (see
      # bot.py) without duplicating it — same file the litellm container
      # imports via callbacks/nevnew_persona.py.
      - ./callbacks/nevnew_persona_prompt.py:/app/nevnew_persona_prompt.py:ro
      # Host's already-authenticated Cline account (separate OpenRouter-free
      # quota pool) — read-write because the cline CLI writes session/lock
      # state under here. Mounted read-write, not exposed on a port; only
      # this container process (root, same as everything else in this
      # compose file) can reach it.
      - ${HOME}/.cline:/cline-home
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - newnew-net

networks:
  newnew-net:
    driver: bridge

volumes:
  newnew_open_webui_data:
    name: newnew_open_webui_data
