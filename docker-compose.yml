services:
  # PostgreSQL — required by LiteLLM's budget/spend tracking (newer litellm
  # builds reject sqlite DATABASE_URL outright; budget caps + alert webhooks
  # (issue #40) need a real database anyway).
  postgres:
    image: postgres:16-alpine
    container_name: newnew-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Container resource limits (issue #63): Postgres only holds LiteLLM's
    # budget/spend tables (small, low write volume) — 512m covers shared
    # buffers + connection overhead with headroom.
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - newnew-net

  # Redis — LiteLLM semantic/exact-prefix response cache (Phase 1: prompt
  # caching). Survives restarts; shared across LiteLLM workers.
  redis:
    image: redis:7-alpine
    container_name: newnew-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Container resource limits (issue #63): redis's own --maxmemory
    # (256mb) caps the dataset; this leaves headroom for process/connection
    # overhead above that cap.
    deploy:
      resources:
        limits:
          memory: 384m
    networks:
      - newnew-net

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: newnew-litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      - NINEARM_API_KEY=${NINEARM_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - litellm_data:/app/data
      - ./callbacks/nevnew_persona.py:/app/nevnew_persona.py:ro
      - ./callbacks/nevnew_persona_prompt.py:/app/nevnew_persona_prompt.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Container resource limits (issue #63): LiteLLM proxy process (single
    # worker) plus request/response buffering; 1g covers normal load with
    # headroom for occasional spikes.
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - newnew-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: newnew-qdrant
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    # Container resource limits (issue #63): Qdrant keeps vector indexes
    # in memory — this stack's collections are small (per-user memory
    # embeddings), but 1g leaves room to grow before OOM.
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - newnew-net

  n8n:
    image: n8nio/n8n:latest
    container_name: newnew-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=n8n.local
      - WEBHOOK_URL=http://localhost:5678/
      - VUE_APP_SERVER_PORT=5678
      # O2O copilot middleware (n8n/workflows/o2o-copilot-middleware.json) calls
      # LiteLLM on the shared network; the key is passed through for the
      # HTTP Request node's Authorization header.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    # Container resource limits (issue #63): n8n (Node.js) workflow engine;
    # 1g covers typical workflow execution load for this single-tenant
    # instance.
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - newnew-net

  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: newnew-mcpo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - MCPO_API_KEY=${MCPO_API_KEY}
    command:
      [
        "--port", "8000",
        "--api-key", "${MCPO_API_KEY}",
        "--server-type", "streamable-http",
        "--",
        "http://host.docker.internal:5678/mcp/b7e2d1a4-9c3f-4e8a-a6d2-5f1b0c7e9d21",
      ]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Container resource limits (issue #63): mcpo is a thin MCP<->HTTP
    # bridge with minimal state; 256m is generous headroom for its
    # footprint.
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - newnew-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: newnew-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_NAME=นิวนิว
      # Public tunnel serves the WebUI — open signup would let anyone
      # create an account (#73). First-user bootstrap still works with
      # zero users in the DB (that registration becomes admin).
      - ENABLE_SIGNUP=false
      - ENABLE_OLLAMA_API=false
    volumes:
      - newnew_open_webui_data:/app/backend/data
      - ./open-webui/custom.css:/app/build/static/custom.css:ro
      - ./open-webui/decor-bg.svg:/app/build/static/decor-bg.svg:ro
    depends_on:
      litellm:
        condition: service_healthy
    # Container resource limits (issue #63): Open-WebUI's cached embedding
    # model alone measures ~963MB in this stack (see BACKLOG.md backup-size
    # note); 2g leaves headroom above that for the app process + requests.
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - newnew-net

  telegram-bot:
    build: ./telegram-bot
    container_name: newnew-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID}
      # Cline primary backend: the 9arm gateway key (same provider/model as
      # the Cline session). Passed to the cline CLI via -k at runtime.
      - NINEARM_API_KEY=${NINEARM_API_KEY}
      # Fallback backend: the claude CLI pointed at the SAME 9arm gateway
      # (Anthropic-format /v1/messages endpoint) running the SAME model as
      # primary — the whole bot runs on one provider/model, no separate
      # account/quota. (Replaces the old Sonnet OAuth fallback, 2026-09-13.)
      - ANTHROPIC_BASE_URL=https://gateway.9arm.co
      - ANTHROPIC_AUTH_TOKEN=${NINEARM_API_KEY}
      - ANTHROPIC_SMALL_FAST_MODEL=qwen3.8-27b-fp8
      - CLAUDE_FALLBACK_MODEL=qwen3.8-27b-fp8
      # One Brain (#70 cutover): ai-core is the primary chat path.
      # Rollback: set USE_AI_CORE=false in .env and recreate.
      - AICORE_BASE_URL=http://ai-core:8000
      - AICORE_API_KEY=${AICORE_API_KEY}
      - USE_AI_CORE=${USE_AI_CORE:-true}
      # Voice loop (#61): Groq Whisper STT (key already in .env).
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./callbacks/nevnew_persona_prompt.py:/app/nevnew_persona_prompt.py:ro
    # Container resource limits (issue #63): telegram-bot shells out to the
    # cline/claude CLIs per message rather than holding large in-process
    # state; 512m is comfortable headroom for that.
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - newnew-net

  # Long-term memory (mem0 + Qdrant, per-user collections). See
  # memory/compose-snippet.yml. Do NOT add `env_file: .env` here — mem0's
  # OpenAI LLM provider auto-routes to OpenRouter when OPENROUTER_API_KEY is
  # present, bypassing the LiteLLM proxy (and its budget cap).
  memory:
    build: ./memory
    container_name: newnew-memory
    restart: unless-stopped
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - MEM0_GROQ_MODEL=qwen/qwen3.8-27b
      # GROQ_API_KEY comes from .env so the memory image sees it (the
      # service deliberately does NOT use env_file: mem0's OpenAI-LLM
      # auto-route would leak extraction to OpenRouter otherwise).
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MEMORY_API_KEY=${MEMORY_API_KEY}
      - MEM0_TELEMETRY=false
    volumes:
      # SQLite history (mem0) + the downloaded embedding model cache.
      - nevnew_memory_data:/data
    ports:
      # Ops/debug access from the host; in-network callers use
      # http://memory:8000 (no port publish needed).
      - "127.0.0.1:8011:8000"
    depends_on:
      - qdrant
      - litellm
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # Container resource limits (issue #63): mem0 loads CPU torch +
    # sentence-transformers for local embeddings (Dockerfile note: the
    # embedding model itself is ~470MB on disk; loaded torch + model +
    # mem0/fastapi process typically runs 800MB-1.5GB resident). 2g gives
    # real headroom above that so the container OOMs before starving the
    # host instead of the other way around.
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - newnew-net

  # AI Core chat harness: persona + memories + tools -> model -> reply.
  # The single API surface for channels (telegram-bot, n8n). See
  # ai-core/compose-snippet.yml.
  ai-core:
    build: ./ai-core
    container_name: newnew-ai-core
    restart: unless-stopped
    environment:
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - NEVNEW_MODEL_NAME=NevNew
      - MEMORY_BASE_URL=http://memory:8000
      - MEMORY_API_KEY=${MEMORY_API_KEY}
      - MCPO_BASE_URL=http://mcpo:8000
      - MCPO_API_KEY=${MCPO_API_KEY}
      - AICORE_API_KEY=${AICORE_API_KEY}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-auto}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
    volumes:
      - ./callbacks/nevnew_persona_prompt.py:/app/nevnew_persona_prompt.py:ro
    ports:
      # Host access for curl/debugging; in-network callers use
      # http://ai-core:8000.
      - "127.0.0.1:8010:8000"
    depends_on:
      litellm:
        condition: service_healthy
      memory:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Container resource limits (issue #63): ai-core is a thin FastAPI
    # request/response harness with no local model weights; 512m is ample.
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - newnew-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: newnew-cloudflared
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    # Container resource limits (issue #63): cloudflared is a lightweight
    # tunnel client; 256m is generous headroom.
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - newnew-net

  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: newnew-cloudflared-quick
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://newnew-open-webui:8080
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - newnew-net

networks:
  newnew-net:
    driver: bridge

volumes:
  newnew_open_webui_data:
    name: newnew_open_webui_data
  litellm_data:
    name: litellm_data
  redis_data:
    name: redis_data
  postgres_data:
    name: postgres_data
  qdrant_storage:
    name: qdrant_storage
  n8n_data:
    name: n8n_data
  nevnew_memory_data:
    name: nevnew_memory_data
