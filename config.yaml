model_list:
  # NevNew's chat models. model_name is what Open-WebUI displays above each
  # assistant message and in the model picker — the underlying backend is
  # qwen3.8-max via OpenRouter (2026-09-06 swap, replacing gemini-3.5-* whose
  # API key was never provisioned — see issues #29/#30/#33/#34).
  #
  # "Medium reasoning": qwen3.8-max-0902 supports the reasoning_effort
  # parameter on OpenRouter (verified in its supported_parameters) and
  # LiteLLM maps reasoning_effort -> OpenRouter `reasoning.effort`.
  #
  # Pricing is NOT free: $2/M prompt, $6/M completion (OpenRouter, verified
  # 2026-09-06 against the models API). The litellm_settings max_budget /
  # budget_duration below ($15 per 30d) is the hard spend cap.
  #
  # rpm limits are self-imposed conservative caps to keep spend predictable.
  - model_name: NevNew
    litellm_params:
      model: openrouter/qwen/qwen3.8-max-0902
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning_effort: medium
      rpm: 30
    model_info:
      id: qwen3-8-max
      mode: chat
  # NevNew-Pro: same backend, kept as a distinct alias for clients that
  # reference it — allows a higher output ceiling for longer tasks.
  - model_name: NevNew-Pro
    litellm_params:
      model: openrouter/qwen/qwen3.8-max-0902
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning_effort: medium
      max_tokens: 16384
      rpm: 10
    model_info:
      id: qwen3-8-max-pro
      mode: chat


litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  request_timeout: 60
  max_budget: 15.0  # $15/month hard budget cap
  budget_duration: "30d"
  callbacks: ["nevnew_persona.nevnew_persona_instance"]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  retry_policy:
    RateLimitErrorRetries: 5
    ConnectionErrorRetries: 3
    TimeoutErrorRetries: 3
    InternalServerErrorRetries: 3
  cooldown_time: 30
  disable_cooldowns: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: false
