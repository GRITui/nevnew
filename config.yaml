model_list:
  # NevNew's chat engine. model_name is what Open-WebUI displays above each
  # assistant message and in the model picker. This is intentionally pinned
  # to 9arm's OpenAI-compatible gateway (set 2026-09-12) instead of the old
  # OpenRouter fallback chain.
  - model_name: NevNew
    litellm_params:
      model: openai/qwen3.8-27b-fp8
      api_base: https://gateway.9arm.co/v1
      api_key: os.environ/NINEARM_API_KEY
      max_tokens: 8192
      rpm: 20
    model_info:
      id: qwen3-8-27b-fp8-9arm
      mode: chat

  # NevNew-Pro: paid, kept as a distinct alias for clients that reference
  # it directly. The 16384 max_tokens cap here is critical: without it,
  # LiteLLM forwards the full context window and OpenRouter 402s with
  # "requested 65536 tokens but can only afford 1120" (root cause of
  # #41/#42/#43).
  - model_name: NevNew-Pro
    litellm_params:
      model: openrouter/qwen/qwen3.8-max-0902
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning_effort: medium
      max_tokens: 16384
      rpm: 10
    model_info:
      id: qwen3-8-max-pro
      mode: chat


litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  request_timeout: 60
  max_budget: 15.0  # $15/month hard budget cap (only NevNew-Pro can hit it)
  budget_duration: "30d"
  callbacks: ["nevnew_persona.nevnew_persona_instance"]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  retry_policy:
    RateLimitErrorRetries: 5
    ConnectionErrorRetries: 3
    TimeoutErrorRetries: 3
    InternalServerErrorRetries: 3
  cooldown_time: 30
  disable_cooldowns: false
  # Fallback across deployments within the same model_name group on any
  # retriable error (429/5xx/connection). This is what was missing in the
  # previous single-deployment config (root cause of #33/#34/#35 showing
  # "Available Model Group Fallbacks=None").
  enable_pre_call_checks: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: false
